<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summary Privileges</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 30px;
font-family: Arial, sans-serif;
background: #f6f9ff;
color: #10295b;
}

.container {
max-width: 1100px;
margin: auto;
background: white;
border: 1px solid #dce7f7;
border-radius: 18px;
box-shadow: 0 8px 25px rgba(30, 70, 120, 0.08);
overflow: hidden;
}

/* Header */
.header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 28px 40px;
background: #f8fbff;
border-bottom: 1px solid #dce7f7;
}

.title {
margin: 0;
font-size: 34px;
font-weight: 700;
}

.masked {
padding: 10px 16px;
border: 1px solid #d5e3f7;
border-radius: 10px;
color: #5876a5;
font-size: 16px;
font-weight: 600;
background: #fff;
}

/* Content */
.content {
padding: 28px;
}

.section {
margin-bottom: 20px;
border: 1px solid #dce7f7;
border-radius: 14px;
overflow: hidden;
}

.section:last-child {
margin-bottom: 0;
}

.section-title {
padding: 16px 26px;
font-size: 24px;
font-weight: 700;
}

.push {
background: #edf5ff;
}

.upscale {
background: #eefaf8;
}

.otp {
background: #fff5e9;
}

.sms {
background: #f2f1ff;
}

/* Rows */
.row {
min-height: 74px;
display: grid;
grid-template-columns: 1fr 1fr;
align-items: center;
padding: 12px 55px;
background: white;
border-top: 1px solid #e5edf8;
font-size: 18px;
}

.row-left {
font-weight: 600;
}

.row-right {
display: flex;
align-items: center;
gap: 30px;
}

/* Checkbox */
.checkbox {
width: 28px;
height: 28px;
border-radius: 6px;
background: #1683ed;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}

.checkbox::after {
content: "✓";
color: white;
font-size: 20px;
font-weight: bold;
}

@media (max-width: 700px) {

body {
padding: 12px;
}

.header {
padding: 22px;
gap: 15px;
flex-direction: column;
align-items: flex-start;
}

.title {
font-size: 28px;
}

.content {
padding: 15px;
}

.row {
grid-template-columns: 1fr;
gap: 12px;
padding: 15px 20px;
}

.row-right {
gap: 15px;
}
}
</style>
</head>

<body>

<div class="container">

<!-- Header -->
<div class="header">
<h1 class="title">Summary Privileges</h1>

<div class="masked">
Masked RCS Columns
</div>
</div>


<div class="content">

<!-- Push Traffic -->
<div class="section">
<div class="section-title push">
Push Traffic
</div>

<div class="row">
<div class="row-left">
DLT Template Summary
</div>

<div class="row-right">
<div class="checkbox"></div>
<span>Template Summary</span>
</div>
</div>
</div>


<!-- Upscale -->
<div class="section">
<div class="section-title upscale">
Upscale Report
</div>

<div class="row">
<div class="row-left">
Upscale Summary
</div>

<div class="row-right">
<div class="checkbox"></div>
<span>Upscale Summary</span>
</div>
</div>
</div>


<!-- OTP -->
<div class="section">
<div class="section-title otp">
OTP Traffic
</div>

<div class="row">
<div class="row-left">
OTP Traffic
</div>

<div class="row-right">
<div class="checkbox"></div>
<span>Attemptwise Summary</span>
</div>
</div>

<div class="row">
<div class="row-left">
OTP Traffic
</div>

<div class="row-right">
<div class="checkbox"></div>
<span>Attemptwise Latency Summary</span>
</div>
</div>
</div>


<!-- SMS -->
<div class="section">
<div class="section-title sms">
OTP Traffic
</div>

<div class="row">
<div class="row-left">
OTP Traffic
</div>

<div class="row-right">
<div class="checkbox"></div>
<span>Status Summary(SMS)</span>
</div>
</div>
</div>

</div>
</div>

</body>
</html>
